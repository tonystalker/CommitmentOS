version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: commitmentos_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: commitmentos
      POSTGRES_USER: commitmentos
      POSTGRES_PASSWORD: commitmentos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
